name: Telemed Software Quality Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  quality-analysis:
    name: Build, Test and SonarQube Analysis
    runs-on: self-hosted

    env:
      POSTGRES_USER: telemed_user
      POSTGRES_PASSWORD: telemed_password
      POSTGRES_DB: telemed_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      DATABASE_URL: postgresql+asyncpg://telemed_user:telemed_password@localhost:5434/telemed_db
      SYNC_DATABASE_URL: postgresql://telemed_user:telemed_password@localhost:5434/telemed_db
      BASE_URL: http://localhost:8000

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # ENVIRONMENT
      # -------------------------------------------------------

      - name: Verify runner environment
        run: |
          echo "============================================="
          echo "RUNNER ENVIRONMENT"
          echo "============================================="

          echo "Runner architecture: $(uname -m)"
          echo "macOS version: $(sw_vers -productVersion)"

          echo "Python:"
          python3 --version

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Docker:"
          docker --version

          echo "Docker Compose:"
          docker compose version

      # -------------------------------------------------------
      # DATABASE
      # -------------------------------------------------------

      - name: Start PostgreSQL
        run: |
          echo "============================================="
          echo "STARTING POSTGRESQL"
          echo "============================================="

          docker compose down --remove-orphans || true

          docker compose up -d telemed-postgres

          echo "PostgreSQL container status:"
          docker ps --filter "name=telemed-postgres"

      - name: Wait for PostgreSQL
        run: |
          echo "============================================="
          echo "WAITING FOR POSTGRESQL"
          echo "============================================="

          for i in {1..30}; do
            if docker exec telemed-postgres pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" > /dev/null 2>&1; then

              echo "PostgreSQL is ready."
              exit 0
            fi

            echo "PostgreSQL is not ready yet..."
            sleep 2
          done

          echo "PostgreSQL failed to become ready."

          echo "============================================="
          echo "POSTGRESQL LOG"
          echo "============================================="

          docker logs telemed-postgres

          exit 1

      # -------------------------------------------------------
      # BACKEND SETUP
      # -------------------------------------------------------

      - name: Create backend virtual environment
        working-directory: backend
        run: |
          echo "============================================="
          echo "BACKEND ENVIRONMENT"
          echo "============================================="

          rm -rf venv

          python3 -m venv venv

          source venv/bin/activate

          python -m pip install --upgrade pip

          pip install -r requirements.txt

      - name: Verify backend dependencies
        working-directory: backend
        run: |
          source venv/bin/activate

          echo "============================================="
          echo "BACKEND DEPENDENCIES"
          echo "============================================="

          echo "Python:"
          python --version

          echo "Pytest:"
          pytest --version

          python -c "import fastapi; print('FastAPI:', fastapi.__version__)"
          python -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          python -c "import asyncpg; print('asyncpg:', asyncpg.__version__)"
          python -c "import greenlet; print('greenlet:', greenlet.__version__)"
          python -c "import coverage; print('coverage:', coverage.__version__)"

      # -------------------------------------------------------
      # DATABASE INITIALIZATION
      # -------------------------------------------------------

      - name: Initialize backend database
        working-directory: backend
        run: |
          echo "============================================="
          echo "INITIALIZING DATABASE"
          echo "============================================="

          source venv/bin/activate

          python -m app.seed

      - name: Verify seeded admin account
        working-directory: backend
        run: |
          echo "============================================="
          echo "VERIFYING ADMIN ACCOUNT"
          echo "============================================="

          source venv/bin/activate

          python - <<'PY'
          import asyncio
          import asyncpg

          async def check():
              conn = await asyncpg.connect(
                  "postgresql://telemed_user:telemed_password@localhost:5434/telemed_db"
              )

              try:
                  row = await conn.fetchrow(
                      """
                      SELECT id, username, email, role, is_active
                      FROM users
                      WHERE username = 'admin'
                      """
                  )

                  print(
                      "Admin database record:",
                      dict(row) if row else None
                  )

                  assert row is not None, "Default admin was not created"
                  assert row["username"] == "admin"
                  assert row["is_active"] is True

                  print("Admin account verification passed.")

              finally:
                  await conn.close()

          asyncio.run(check())
          PY

      # -------------------------------------------------------
      # START FASTAPI
      # -------------------------------------------------------

      - name: Start FastAPI application
        working-directory: backend
        run: |
          echo "============================================="
          echo "STARTING FASTAPI"
          echo "============================================="

          source venv/bin/activate

          rm -f coverage.data coverage.xml
          rm -f ../fastapi.log ../fastapi.pid

          PYTHONUNBUFFERED=1 coverage run \
            --source=app \
            --data-file=coverage.data \
            -m uvicorn app.main:app \
            --host 0.0.0.0 \
            --port 8000 \
            --log-level debug \
            > ../fastapi.log 2>&1 &

          FASTAPI_PID=$!

          echo "$FASTAPI_PID" > ../fastapi.pid

          echo "FastAPI PID: $FASTAPI_PID"

      - name: Wait for FastAPI
        run: |
          echo "============================================="
          echo "WAITING FOR FASTAPI"
          echo "============================================="

          for i in {1..30}; do
            if curl --fail --silent \
              http://localhost:8000/health > /dev/null 2>&1; then

              echo "FastAPI is ready."
              exit 0
            fi

            echo "FastAPI is not ready yet..."
            sleep 2
          done

          echo "FastAPI failed to start."

          echo "============================================="
          echo "FASTAPI LOG"
          echo "============================================="

          cat fastapi.log || true

          exit 1

      # -------------------------------------------------------
      # APPLICATION DATABASE CONNECTIVITY
      # -------------------------------------------------------

      - name: Verify application database connectivity
        working-directory: backend
        run: |
          echo "============================================="
          echo "VERIFYING APPLICATION DATABASE CONNECTION"
          echo "============================================="

          source venv/bin/activate

          python - <<'PY'
          import asyncio

          from sqlalchemy import text
          from app.database import async_engine

          async def check_database():
              try:
                  async with async_engine.connect() as connection:
                      result = await connection.execute(text("SELECT 1"))
                      value = result.scalar()

                      assert value == 1, (
                          "Database query did not return expected result"
                      )

                      print("Application database connection is healthy.")

              finally:
                  await async_engine.dispose()

          asyncio.run(check_database())
          PY

      # -------------------------------------------------------
      # BACKEND TESTS
      # -------------------------------------------------------

      - name: Run backend end-to-end tests
        id: backend_tests
        working-directory: backend
        run: |
          echo "============================================="
          echo "BACKEND END-TO-END TESTS"
          echo "============================================="

          source venv/bin/activate

          pytest -v -s

      # -------------------------------------------------------
      # STOP FASTAPI
      # -------------------------------------------------------

      - name: Stop FastAPI application
        if: always()
        run: |
          echo "============================================="
          echo "STOPPING FASTAPI"
          echo "============================================="

          if [ -f fastapi.pid ]; then
            FASTAPI_PID=$(cat fastapi.pid)

            echo "Stopping FastAPI process: $FASTAPI_PID"

            kill "$FASTAPI_PID" 2>/dev/null || true

            for i in {1..10}; do
              if ! kill -0 "$FASTAPI_PID" 2>/dev/null; then
                echo "FastAPI stopped cleanly."
                rm -f fastapi.pid
                exit 0
              fi

              echo "Waiting for FastAPI to stop..."
              sleep 1
            done

            echo "FastAPI did not stop gracefully. Force stopping..."

            kill -9 "$FASTAPI_PID" 2>/dev/null || true

            rm -f fastapi.pid
          else
            echo "FastAPI PID file was not found."
          fi

      # -------------------------------------------------------
      # BACKEND COVERAGE
      # -------------------------------------------------------

      - name: Generate backend coverage report
        if: always()
        working-directory: backend
        run: |
          source venv/bin/activate

          echo "============================================="
          echo "BACKEND COVERAGE"
          echo "============================================="

          if [ -f coverage.data ]; then

            coverage xml \
              --data-file=coverage.data \
              -o coverage.xml

            coverage report \
              --data-file=coverage.data

            echo "Backend coverage XML generated successfully."

          else
            echo "Backend coverage data was not generated."
          fi

      # -------------------------------------------------------
      # DISPLAY FASTAPI LOG
      # -------------------------------------------------------

      - name: Display FastAPI log
        if: always()
        run: |
          echo "============================================="
          echo "FASTAPI APPLICATION LOG"
          echo "============================================="

          if [ -f fastapi.log ]; then
            cat fastapi.log
          else
            echo "fastapi.log was not found."
          fi

      # -------------------------------------------------------
      # FRONTEND
      # -------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          echo "============================================="
          echo "INSTALLING FRONTEND DEPENDENCIES"
          echo "============================================="

          npm ci

      - name: Run frontend lint
        id: frontend_lint
        working-directory: frontend
        run: |
          echo "============================================="
          echo "FRONTEND ESLINT"
          echo "============================================="

          npm run lint

      - name: Run frontend tests with coverage
        id: frontend_tests
        working-directory: frontend
        run: |
          echo "============================================="
          echo "FRONTEND TESTS"
          echo "============================================="

          npm run test:coverage

      - name: Build frontend
        id: frontend_build
        working-directory: frontend
        run: |
          echo "============================================="
          echo "FRONTEND PRODUCTION BUILD"
          echo "============================================="

          npm run build

      # -------------------------------------------------------
      # SONARQUBE
      # -------------------------------------------------------

      - name: Check SonarQube availability
        run: |
          echo "============================================="
          echo "SONARQUBE AVAILABILITY"
          echo "============================================="

          if [ -z "${{ secrets.SONAR_HOST_URL }}" ]; then
            echo "SONAR_HOST_URL secret is not configured."
            exit 1
          fi

          curl --fail --silent \
            "${{ secrets.SONAR_HOST_URL }}/api/system/status"

          echo
          echo "SonarQube is available."

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -------------------------------------------------------
      # METRICS REPORT
      # -------------------------------------------------------

      - name: Generate software metrics report
        if: always()
        run: |
          mkdir -p quality-report

          echo "============================================="
          echo "GENERATING SOFTWARE QUALITY METRICS REPORT"
          echo "============================================="

          BACKEND_TEST_STATUS="FAILED"
          if [ "${{ steps.backend_tests.outcome }}" = "success" ]; then
            BACKEND_TEST_STATUS="PASSED"
          fi

          FRONTEND_LINT_STATUS="FAILED"
          if [ "${{ steps.frontend_lint.outcome }}" = "success" ]; then
            FRONTEND_LINT_STATUS="PASSED"
          fi

          FRONTEND_TEST_STATUS="FAILED"
          if [ "${{ steps.frontend_tests.outcome }}" = "success" ]; then
            FRONTEND_TEST_STATUS="PASSED"
          fi

          FRONTEND_BUILD_STATUS="FAILED"
          if [ "${{ steps.frontend_build.outcome }}" = "success" ]; then
            FRONTEND_BUILD_STATUS="PASSED"
          fi

          BACKEND_COVERAGE="Unavailable"

          if [ -f backend/coverage.xml ]; then
            BACKEND_COVERAGE=$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("backend/coverage.xml").getroot()

          line_rate = root.attrib.get("line-rate")

          if line_rate is not None:
              print(f"{float(line_rate) * 100:.2f}%")
          else:
              print("Unavailable")
          PY
            )
          fi

          FRONTEND_COVERAGE="Unavailable"

          if [ -f frontend/coverage/coverage-summary.json ]; then
            FRONTEND_COVERAGE=$(python3 - <<'PY'
          import json

          with open("frontend/coverage/coverage-summary.json") as f:
              data = json.load(f)

          total = data.get("total", {})
          lines = total.get("lines", {})

          if "pct" in lines:
              print(f"{lines['pct']}%")
          else:
              print("Unavailable")
          PY
            )
          fi

          cat > quality-report/metrics-summary.txt <<EOF
          TELEMED APPLICATION
          SOFTWARE QUALITY METRICS REPORT
          =============================================

          CI/CD QUALITY PIPELINE
          ---------------------------------------------
          Pipeline: GitHub Actions
          Runner: Self-hosted macOS ARM64

          BACKEND QUALITY
          ---------------------------------------------
          Framework: FastAPI
          Test framework: pytest
          End-to-end test suite: Comprehensive E2E verification
          Backend E2E result: ${BACKEND_TEST_STATUS}
          Backend line coverage: ${BACKEND_COVERAGE}
          Coverage report: backend/coverage.xml

          FRONTEND QUALITY
          ---------------------------------------------
          Framework: React + Vite
          Test framework: Vitest
          Linting: ESLint
          ESLint result: ${FRONTEND_LINT_STATUS}
          Frontend test result: ${FRONTEND_TEST_STATUS}
          Frontend line coverage: ${FRONTEND_COVERAGE}
          Production build result: ${FRONTEND_BUILD_STATUS}
          Coverage report: frontend/coverage/lcov.info

          STATIC ANALYSIS
          ---------------------------------------------
          Tool: SonarQube
          Analysis: Executed by GitHub Actions
          Quality Gate: Evaluated by SonarQube

          REPORT INFORMATION
          ---------------------------------------------
          Commit: ${{ github.sha }}
          Branch: ${{ github.ref_name }}
          Workflow: ${{ github.workflow }}
          Run number: ${{ github.run_number }}

          =============================================
          END OF REPORT
          =============================================
          EOF

          echo "============================================="
          echo "SOFTWARE QUALITY METRICS REPORT"
          echo "============================================="

          cat quality-report/metrics-summary.txt

      # -------------------------------------------------------
      # UPLOAD REPORTS
      # -------------------------------------------------------

      - name: Upload software quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemed-software-quality-reports
          path: |
            backend/coverage.xml
            frontend/coverage/
            quality-report/
            fastapi.log
          if-no-files-found: warn

      # -------------------------------------------------------
      # CLEANUP
      # -------------------------------------------------------

      - name: Stop PostgreSQL
        if: always()
        run: |
          echo "============================================="
          echo "STOPPING POSTGRESQL"
          echo "============================================="

          docker compose down --remove-orphans

          echo "PostgreSQL stopped."