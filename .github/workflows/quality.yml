name: Telemed Software Quality Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  quality-analysis:
    name: Build, Test and SonarQube Analysis
    runs-on: self-hosted

    env:
      POSTGRES_USER: telemed_user
      POSTGRES_PASSWORD: telemed_password
      POSTGRES_DB: telemed_db
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5434
      DATABASE_URL: postgresql+asyncpg://telemed_user:telemed_password@localhost:5434/telemed_db
      SYNC_DATABASE_URL: postgresql://telemed_user:telemed_password@localhost:5434/telemed_db

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify runner environment
        run: |
          echo "Runner: $(uname -m)"
          echo "macOS: $(sw_vers -productVersion)"
          python3 --version
          node --version
          npm --version
          docker --version

      # -------------------------------------------------------
      # DATABASE
      # -------------------------------------------------------

      - name: Start PostgreSQL
        run: |
          docker compose up -d telemed-postgres

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL..."

          for i in {1..30}; do
            if docker exec telemed-postgres pg_isready \
              -U "$POSTGRES_USER" \
              -d "$POSTGRES_DB" > /dev/null 2>&1; then
              echo "PostgreSQL is ready."
              break
            fi

            echo "PostgreSQL is not ready yet..."
            sleep 2
          done

          docker exec telemed-postgres pg_isready \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB"

      # -------------------------------------------------------
      # BACKEND
      # -------------------------------------------------------

      - name: Create backend virtual environment
        working-directory: backend
        run: |
          rm -rf venv
          python3 -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests with coverage
        working-directory: backend
        run: |
          source venv/bin/activate

          pytest -v -s \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      # -------------------------------------------------------
      # FRONTEND
      # -------------------------------------------------------

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: |
          npm run lint

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: |
          npm run test:coverage

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      # -------------------------------------------------------
      # SONARQUBE
      # -------------------------------------------------------

      - name: Check SonarQube availability
        run: |
          curl --fail --silent \
            "${{ secrets.SONAR_HOST_URL }}/api/system/status"

      - name: SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube quality gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # -------------------------------------------------------
      # METRICS REPORT
      # -------------------------------------------------------

      - name: Generate software metrics report
        run: |
          mkdir -p quality-report

          cat > quality-report/metrics-summary.txt <<'EOF'
          TELEMED APPLICATION
          SOFTWARE QUALITY METRICS REPORT
          =============================================

          CI/CD QUALITY PIPELINE
          ---------------------------------------------
          Pipeline: GitHub Actions
          Runner: Self-hosted macOS ARM64

          BACKEND QUALITY
          ---------------------------------------------
          Framework: FastAPI
          Test framework: pytest
          End-to-end tests: 14
          Coverage report: backend/coverage.xml

          FRONTEND QUALITY
          ---------------------------------------------
          Framework: React + Vite
          Test framework: Vitest
          Linting: ESLint
          Coverage report: frontend/coverage/lcov.info
          Production build: Successful

          STATIC ANALYSIS
          ---------------------------------------------
          Tool: SonarQube
          Analysis: Completed by CI pipeline
          Quality Gate: Evaluated by SonarQube

          =============================================
          END OF REPORT
          EOF

      - name: Upload software quality reports
        uses: actions/upload-artifact@v4
        with:
          name: telemed-software-quality-reports
          path: |
            backend/coverage.xml
            frontend/coverage/
            quality-report/

      # -------------------------------------------------------
      # CLEANUP
      # -------------------------------------------------------

      - name: Stop PostgreSQL
        if: always()
        run: |
          docker compose down