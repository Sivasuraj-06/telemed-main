sonar.projectKey=telemed-quality
sonar.projectName=Telemed Application - Automated Quality Assessment
sonar.projectVersion=1.0

sonar.sources=backend/app,frontend/src,email-service
sonar.tests=backend/tests,frontend/src/__tests__

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/__pycache__/**,**/uploads/**,**/*.min.js

sonar.test.exclusions=**/node_modules/**,**/dist/**

sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8